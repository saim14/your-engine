name: ThinkGate tests

on:
  push:
    branches: [thinkgate-mvp]
    paths:
      - "thinkgate/**"
      - ".github/workflows/thinkgate-tests.yml"
  pull_request:
    paths:
      - "thinkgate/**"
      - ".github/workflows/thinkgate-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thinkgate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python run_example.py
